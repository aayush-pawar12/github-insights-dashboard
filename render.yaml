# Render.com blueprint — deploys the dashboard as a free web service.
# One-click: push this repo to GitHub, then on Render choose
# "New +" -> "Blueprint" and point it at the repo.
services:
  - type: web
    name: github-insights-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # Optional: raise GitHub's rate limit from 60 to 5000 req/hr.
      # Set this value in the Render dashboard (Environment tab); leave unset to run unauthenticated.
      - key: GITHUB_TOKEN
        sync: false
